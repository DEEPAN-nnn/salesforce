<template>
    <div class="hp-wrapper">
        <template if:true={isActionLoading}>
            <div class="hp-spinner-overlay">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <div class="hp-header">
            <div class="hp-title-wrap">
                <span class="hp-icon-container">
                    <lightning-icon icon-name={iconName} size="medium"></lightning-icon>
                </span>
                <div class="hp-title-text">
                    <div class="hp-object-label">Sales Funnel</div>
                    <div class="hp-record-name">{recordName}</div>
                </div>
            </div>

            <!--
                Actions mirrored from standard Dynamic Highlights Panel (App Builder).
                Order matches: Mark dead → Generate Proposal → Related Property →
                Assign/Change Assistant → Update Location → (overflow) rest.

                Visibility: implemented in JS (NOT imported from App Builder eye icons).
                App Builder filters cannot be read by LWC — see JS comments.
            -->
            <div class="hp-actions">
                <button class={followClass} onclick={handleFollow} disabled={isFollowLoading}>
                    {followLabel}
                </button>

                <!-- Mark dead — existing LWC (no App Builder visibility on standard panel) -->
                <c-mark-dead-button-flow record-id={recordId}></c-mark-dead-button-flow>

                <template if:true={showGenerateProposalBtn}>
                    <button
                        class="hp-btn hp-btn-standard"
                        data-action="Enquiry__c.Generate_Proposal"
                        onclick={handleQuickAction}
                    >
                        Generate Proposal
                    </button>
                </template>

                <template if:true={showRelatedPropertyBtn}>
                    <button
                        class="hp-btn hp-btn-standard"
                        data-action="Enquiry__c.Related_Property"
                        onclick={handleQuickAction}
                    >
                        Related Property
                    </button>
                </template>

                <template if:true={showAssignAssistant}>
                    <button
                        class="hp-btn hp-btn-standard"
                        data-action="Enquiry__c.Assign_Assistant"
                        onclick={handleQuickAction}
                    >
                        Assign Assistant
                    </button>
                </template>

                <template if:true={showChangePropertyAssistant}>
                    <button
                        class="hp-btn hp-btn-standard"
                        data-action="Enquiry__c.Change_Property_Assistant"
                        onclick={handleQuickAction}
                    >
                        Change Property Assistant
                    </button>
                </template>

                <template if:true={showUpdateLocationBtn}>
                    <button
                        class="hp-btn hp-btn-standard"
                        data-action="Enquiry__c.Update_Location"
                        onclick={handleQuickAction}
                    >
                        Update Location
                    </button>
                </template>

                <lightning-button-menu
                    alternative-text="Show more actions"
                    menu-alignment="right"
                    icon-size="small"
                    onselect={handleMenuSelect}
                >
                    <template if:true={showDeleteRelatedListItem}>
                        <lightning-menu-item
                            value="Enquiry__c.Delete_Related_List"
                            label="Delete Related List"
                        ></lightning-menu-item>
                    </template>
                    <template if:true={showEditItem}>
                        <lightning-menu-item value="edit" label="Edit"></lightning-menu-item>
                    </template>
                    <template if:true={showCloneItem}>
                        <lightning-menu-item value="clone" label="Clone"></lightning-menu-item>
                    </template>
                    <template if:true={showMergeEnquiry}>
                        <lightning-menu-item
                            value="Enquiry__c.Merge_Enquiry"
                            label="Merge Enquiry"
                        ></lightning-menu-item>
                    </template>

                    <!-- No App Builder visibility on standard panel -->
                    <lightning-menu-item value="Global.NewEvent" label="New Event"></lightning-menu-item>
                    <lightning-menu-item value="Global.NewTask" label="New Task"></lightning-menu-item>
                    <lightning-menu-item value="Global.LogACall" label="Log a Call"></lightning-menu-item>
                    <!-- Post / Poll: App Builder phone icon = mobile only -->
                    <template if:true={showPostPoll}>
                        <lightning-menu-item value="post" label="Post"></lightning-menu-item>
                        <lightning-menu-item value="poll" label="Poll"></lightning-menu-item>
                    </template>
                    <lightning-menu-item value="Enquiry__c.Sharing" label="Sharing"></lightning-menu-item>
                    <lightning-menu-item value="delete" label="Delete"></lightning-menu-item>
                </lightning-button-menu>
            </div>
        </div>

        <div class="hp-fields">
            <div class="hp-field">
                <p class="hp-field-label" title="Contact 1 Phone">Contact 1 Phone</p>
                <p class="hp-field-value" title={contactPhone}>{contactPhoneDisplay}</p>
            </div>
            <div class="hp-field">
                <p class="hp-field-label" title="Requirement">Requirement</p>
                <p class="hp-field-value" title={requirement}>{requirementDisplay}</p>
            </div>
            <div class="hp-field">
                <p class="hp-field-label" title="Sub-Location">Sub-Location</p>
                <p class="hp-field-value" title={subLocation}>{subLocationDisplay}</p>
            </div>
            <div class="hp-field">
                <p class="hp-field-label" title="Stage">Stage</p>
                <p class="hp-field-value" title={currentStatus}>{currentStatusDisplay}</p>
            </div>
            <div class="hp-field">
                <p class="hp-field-label" title="Action">Action</p>
                <p class="hp-field-value" title={stage}>{stageDisplay}</p>
            </div>
            <div class="hp-field">
                <p class="hp-field-label" title="Channels">Channels</p>
                <p class="hp-field-value" title={channel}>{channelDisplay}</p>
            </div>
        </div>
    </div>

    <!-- ===================== POST MODAL ===================== -->
    <template if:true={showPostModal}>
        <section role="dialog" tabindex="-1" class="hp-modal-backdrop" onclick={closeChatterModals}>
            <div class="hp-modal" onclick={stopPropagation}>
                <div class="hp-modal-header">
                    <h2 class="slds-text-heading_small">Post</h2>
                    <button class="modal-close-btn" onclick={closeChatterModals} title="Close">&times;</button>
                </div>
                <div class="hp-modal-body">
                    <lightning-textarea
                        label="Share an update"
                        value={postBody}
                        onchange={handlePostBodyChange}
                        max-length="10000"
                    ></lightning-textarea>
                </div>
                <div class="hp-modal-footer">
                    <lightning-button label="Cancel" onclick={closeChatterModals}></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Share"
                        onclick={submitPost}
                        disabled={isChatterSaving}
                        class="slds-m-left_x-small"
                    ></lightning-button>
                </div>
            </div>
        </section>
    </template>

    <!-- ===================== POLL MODAL ===================== -->
    <template if:true={showPollModal}>
        <section role="dialog" tabindex="-1" class="hp-modal-backdrop" onclick={closeChatterModals}>
            <div class="hp-modal" onclick={stopPropagation}>
                <div class="hp-modal-header">
                    <h2 class="slds-text-heading_small">Poll</h2>
                    <button class="modal-close-btn" onclick={closeChatterModals} title="Close">&times;</button>
                </div>
                <div class="hp-modal-body">
                    <lightning-input
                        label="Question"
                        value={pollQuestion}
                        onchange={handlePollQuestionChange}
                        class="slds-m-bottom_small"
                    ></lightning-input>
                    <template for:each={pollChoices} for:item="choice" for:index="index">
                        <lightning-input
                            key={choice.key}
                            label={choice.label}
                            data-index={index}
                            value={choice.value}
                            onchange={handlePollChoiceChange}
                            class="slds-m-bottom_x-small"
                        ></lightning-input>
                    </template>
                    <template if:true={canAddPollChoice}>
                        <lightning-button
                            label="Add choice"
                            onclick={addPollChoice}
                            class="slds-m-top_x-small"
                        ></lightning-button>
                    </template>
                </div>
                <div class="hp-modal-footer">
                    <lightning-button label="Cancel" onclick={closeChatterModals}></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Ask"
                        onclick={submitPoll}
                        disabled={isChatterSaving}
                        class="slds-m-left_x-small"
                    ></lightning-button>
                </div>
            </div>
        </section>
    </template>
</template>
