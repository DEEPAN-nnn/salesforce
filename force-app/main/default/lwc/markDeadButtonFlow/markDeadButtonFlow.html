<template>
    <div class="button-container">
        <button class="mark-dead-btn" onclick={handleClick} disabled={isLoading}>
            <template if:true={isLoading}>
                <lightning-spinner
                    alternative-text="Loading"
                    size="x-small"
                    class="btn-spinner"
                ></lightning-spinner>
            </template>
            <template if:false={isLoading}>
                <lightning-icon
                    icon-name="utility:clear"
                    size="xx-small"
                    class="button-icon"
                    alternative-text=""
                ></lightning-icon>
            </template>
            <span>Mark Dead</span>
        </button>
    </div>
</template>
