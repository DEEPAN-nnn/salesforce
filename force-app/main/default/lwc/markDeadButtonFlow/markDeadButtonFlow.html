<template>
    <div class={containerClass}>
        <!-- Phone: same red rectangular button as web (X + Mark Dead text) -->
        <template if:true={isMobileVariant}>
            <button
                class="mark-dead-btn mark-dead-btn_mobile"
                onclick={openFlow}
                disabled={isBusy}
                type="button"
            >
                <lightning-icon
                    icon-name="utility:clear"
                    size="xx-small"
                    class="button-icon"
                    alternative-text=""
                ></lightning-icon>
                <span>Mark Dead</span>
            </button>
        </template>

        <!-- Desktop: rectangular red button -->
        <template if:false={isMobileVariant}>
            <button class="mark-dead-btn" onclick={openFlow} disabled={isBusy} type="button">
                <lightning-icon
                    icon-name="utility:clear"
                    size="xx-small"
                    class="button-icon"
                    alternative-text=""
                ></lightning-icon>
                <span>Mark Dead</span>
            </button>
        </template>
    </div>

    <!-- Popup modal: Screen Flow runs here (not a new page) -->
    <template if:true={showModal}>
        <section
            role="dialog"
            tabindex="-1"
            class="modal-backdrop"
            onclick={handleBackdropClick}
        >
            <div class="modal-panel" onclick={stopPropagation}>
                <button class="modal-close" onclick={closeModal} title="Close">
                    &times;
                </button>

                <template if:true={showSpinner}>
                    <div class="spinner-wrap">
                        <lightning-spinner
                            alternative-text="Loading"
                            size="small"
                        ></lightning-spinner>
                    </div>
                </template>

                <div class={flowWrapperClass}>
                    <lightning-flow
                        flow-api-name={flowApiName}
                        flow-input-variables={flowInputVariables}
                        onstatuschange={handleFlowStatusChange}
                    ></lightning-flow>
                </div>
            </div>
        </section>
    </template>
</template>
