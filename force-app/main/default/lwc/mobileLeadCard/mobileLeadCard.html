<template>
  <article class={cardClass}>
    <div class="card__top">
      <button
        class="card__open"
        type="button"
        onclick={handleOpen}
        title={openLabel}
      >
        <span class="card__name">{name}</span>
        <span class="card__chev" aria-hidden="true">&rsaquo;</span>
      </button>
      <template if:true={badge}>
        <span class="card__badge">{badge}</span>
      </template>
    </div>

    <template if:true={ownerName}>
      <p class="card__owner">
        <span class="card__owner-k">Owner</span> {ownerName}
      </p>
    </template>

    <p class="card__req">{requirement}</p>

    <div class="card__meta">
      <span class="card__tag"
        ><span class="card__tag-k">Action</span> {action}</span
      >
      <template if:true={stage}>
        <span class="card__tag"
          ><span class="card__tag-k">Stage</span> {stage}</span
        >
      </template>
    </div>

    <p class="card__note">{note}</p>

    <div class="card__acts">
      <a
        class="iconact iconact--call"
        href={telHref}
        onclick={handleCall}
        aria-label={callLabel}
        title="Call"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.25 1.01l-2.2 2.2z"
          ></path>
        </svg>
      </a>
      <button
        class="iconact iconact--wa"
        type="button"
        onclick={handleWhatsApp}
        aria-label="WhatsApp"
        title="WhatsApp"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12.04 2C6.58 2 2.15 6.4 2.15 11.83c0 1.74.46 3.44 1.34 4.94L2 22l5.39-1.41a10.1 10.1 0 0 0 4.65 1.16h.01c5.46 0 9.89-4.4 9.89-9.83C21.94 6.4 17.5 2 12.04 2zm5.76 13.89c-.24.68-1.4 1.3-1.94 1.38-.5.07-1.12.1-1.81-.11-.41-.13-.95-.31-1.63-.61-2.87-1.24-4.74-4.13-4.88-4.32-.14-.19-1.17-1.55-1.17-2.96s.74-2.1 1-2.39c.26-.29.57-.36.76-.36h.55c.17 0 .41-.07.64.49.24.58.82 2 .89 2.15.07.14.12.32.02.51-.1.19-.14.32-.29.49-.14.17-.3.38-.43.51-.14.14-.29.29-.12.56.17.26.74 1.22 1.59 1.98 1.09.97 2.01 1.27 2.3 1.41.29.14.46.12.63-.07.17-.19.72-.84.91-1.13.19-.29.39-.24.65-.14.26.1 1.67.79 1.96.93.29.14.48.22.55.34.07.12.07.7-.17 1.38z"
          ></path>
        </svg>
      </button>
      <button
        class="iconact iconact--log"
        type="button"
        onclick={handleLogCall}
        aria-label="Log a Call"
        title="Log a Call"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="#ffffff"
            d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-3.5-3.5 1.41-1.41L10 14.17l4.59-4.59L16 11l-6 6z"
          ></path>
        </svg>
      </button>
      <button
        class="iconact iconact--event"
        type="button"
        onclick={handleNewEvent}
        aria-label="New Event"
        title="New Event"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="#ffffff"
            d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zM7 12h5v5H7z"
          ></path>
        </svg>
      </button>
    </div>
  </article>
</template>
