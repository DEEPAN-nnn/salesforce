<template>
  <button class="tcard" type="button" onclick={handleTap}>
    <p class="tcard__label">{label}</p>
    <p class="tcard__hero">
      <span class="tcard__achieved">{achievedDisplay}</span>
      <span class="tcard__of"> of {targetDisplay}</span>
    </p>
    <p class={varianceClass}>{varianceDisplay}</p>
    <div class="tcard__track">
      <span class="tcard__fill" style={fillStyle}></span>
    </div>
  </button>
</template>
