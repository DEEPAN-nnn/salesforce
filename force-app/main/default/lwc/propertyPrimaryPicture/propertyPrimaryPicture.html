<template>
    <lightning-card title="Primary Picture">
        <div class="slds-p-horizontal_small slds-p-bottom_small">
            <template lwc:if={isEditing}>
                <lightning-record-edit-form
                    object-api-name="Project__c"
                    record-id={recordId}
                    onsuccess={handleSuccess}>

                    <lightning-input-field
                        field-name="Primary_Picture__c"
                        variant="label-hidden">
                    </lightning-input-field>

                    <div class="slds-p-top_small slds-align_absolute-center">
                        <lightning-button
                            class="slds-m-right_small"
                            label="Cancel"
                            onclick={handleCancel}>
                        </lightning-button>
                        <lightning-button
                            type="submit"
                            label="Save"
                            variant="brand">
                        </lightning-button>
                    </div>
                </lightning-record-edit-form>
            </template>

            <template lwc:else>
                <template lwc:if={pictureUrl}>
                    <lightning-formatted-url
                        value={pictureUrl}
                        target="_blank">
                    </lightning-formatted-url>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak">No primary picture</p>
                </template>

                <div class="slds-p-top_small slds-align_absolute-center">
                    <lightning-button
                        label="Edit"
                        variant="brand"
                        onclick={handleEdit}>
                    </lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
