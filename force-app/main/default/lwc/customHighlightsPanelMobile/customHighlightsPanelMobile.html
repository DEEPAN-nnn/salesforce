<template>
    <div class="mhp-wrapper">
        <template if:true={isActionLoading}>
            <div class="mhp-spinner-overlay">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <!-- Standard Salesforce mobile action bar: circles only -->
        <div class="mhp-bar">
            <!-- Mobile-only Mark Dead LWC: red circle + X + flow modal -->
            <c-mark-dead-button-flow-mobile
                record-id={recordId}
                flow-api-name={markDeadFlowApiName}
            ></c-mark-dead-button-flow-mobile>

            <template for:each={primaryActions} for:item="action">
                <button
                    key={action.key}
                    class="mhp-action"
                    type="button"
                    data-action={action.apiName}
                    onclick={handleQuickAction}
                >
                    <span class="mhp-circle mhp-circle-blue" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" focusable="false">
                            <path fill="#ffffff" d={lightningPath}></path>
                        </svg>
                    </span>
                    <span class="mhp-label">{action.label}</span>
                </button>
            </template>

            <button class="mhp-action" type="button" onclick={openMore}>
                <span class="mhp-circle mhp-circle-blue" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="16" height="16" focusable="false">
                        <circle fill="#ffffff" cx="6" cy="12" r="2"></circle>
                        <circle fill="#ffffff" cx="12" cy="12" r="2"></circle>
                        <circle fill="#ffffff" cx="18" cy="12" r="2"></circle>
                    </svg>
                </span>
                <span class="mhp-label">More</span>
            </button>
        </div>

        <template if:true={showMore}>
            <section class="mhp-more-backdrop" role="dialog" tabindex="-1" onclick={closeMore}>
                <div class="mhp-more-sheet" onclick={stopPropagation}>
                    <!-- Sticky header (handle + Actions) — list scrolls underneath -->
                    <div class="mhp-more-header">
                        <div class="mhp-more-handle"></div>
                        <div class="mhp-more-title">Actions</div>
                    </div>
                    <ul class="mhp-more-list">
                        <template for:each={moreActions} for:item="item">
                            <li key={item.key} class="mhp-more-li">
                                <button
                                    class="mhp-more-item"
                                    type="button"
                                    data-value={item.value}
                                    onclick={handleMoreSelect}
                                >
                                    <span class={item.circleClass} aria-hidden="true">
                                        <svg viewBox="0 0 24 24" width="18" height="18" focusable="false">
                                            <path fill="#ffffff" d={item.svgPath}></path>
                                        </svg>
                                    </span>
                                    <span class="mhp-more-item-label">{item.label}</span>
                                </button>
                            </li>
                        </template>
                    </ul>
                </div>
            </section>
        </template>

        <!-- Post modal -->
        <template if:true={showPostModal}>
            <section class="mhp-modal-backdrop" role="dialog" tabindex="-1" onclick={closeChatterModals}>
                <div class="mhp-modal-panel" onclick={stopPropagation}>
                    <div class="mhp-modal-header">
                        <h2 class="slds-text-heading_small">Post</h2>
                        <button class="mhp-modal-close" type="button" onclick={closeChatterModals}>&times;</button>
                    </div>
                    <div class="mhp-modal-body">
                        <lightning-textarea
                            label="Share an update"
                            value={postBody}
                            onchange={handlePostBodyChange}
                            max-length="10000"
                        ></lightning-textarea>
                    </div>
                    <div class="mhp-modal-footer">
                        <lightning-button label="Cancel" onclick={closeChatterModals}></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Share"
                            onclick={submitPost}
                            disabled={isChatterSaving}
                            class="slds-m-left_x-small"
                        ></lightning-button>
                    </div>
                </div>
            </section>
        </template>

        <!-- Poll modal -->
        <template if:true={showPollModal}>
            <section class="mhp-modal-backdrop" role="dialog" tabindex="-1" onclick={closeChatterModals}>
                <div class="mhp-modal-panel" onclick={stopPropagation}>
                    <div class="mhp-modal-header">
                        <h2 class="slds-text-heading_small">Poll</h2>
                        <button class="mhp-modal-close" type="button" onclick={closeChatterModals}>&times;</button>
                    </div>
                    <div class="mhp-modal-body">
                        <lightning-input
                            label="Question"
                            value={pollQuestion}
                            onchange={handlePollQuestionChange}
                            class="slds-m-bottom_small"
                        ></lightning-input>
                        <template for:each={pollChoices} for:item="choice" for:index="index">
                            <lightning-input
                                key={choice.key}
                                label={choice.label}
                                data-index={index}
                                value={choice.value}
                                onchange={handlePollChoiceChange}
                                class="slds-m-bottom_x-small"
                            ></lightning-input>
                        </template>
                        <template if:true={canAddPollChoice}>
                            <lightning-button
                                label="Add choice"
                                onclick={addPollChoice}
                                class="slds-m-top_x-small"
                            ></lightning-button>
                        </template>
                    </div>
                    <div class="mhp-modal-footer">
                        <lightning-button label="Cancel" onclick={closeChatterModals}></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Ask"
                            onclick={submitPoll}
                            disabled={isChatterSaving}
                            class="slds-m-left_x-small"
                        ></lightning-button>
                    </div>
                </div>
            </section>
        </template>
    </div>
</template>
