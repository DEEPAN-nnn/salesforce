<template>
  <div class="team-reports">
    <template if:true={hasError}>
      <p class="error-banner">{errorMessage}</p>
    </template>

    <div class="section-header-row">
      <p class="section-header">Team Reports</p>
      <span class="section-count">{sectionCount}</span>
    </div>
    <template if:true={hasNoTeamReports}>
      <p class="empty-state">No team reports to show.</p>
    </template>
    <div class="scroll-cap reports">
      <div class={teamReportsInnerClass}>
        <template for:each={compareCards} for:item="card">
          <div key={card.id} class="report-card">
            <div class="card-top">
              <p class="lead-name">{card.title}</p>
              <button
                class="link-navigate"
                data-report-id={card.viewReportId}
                onclick={handleViewReport}
              >
                View
              </button>
            </div>
            <template if:true={card.warning}>
              <p class="lead-remark">{card.warning}</p>
            </template>
            <template if:true={card.isCompare}>
              <div class="score">
                <button
                  class="score-side"
                  data-report-id={card.targetReportId}
                  onclick={handleViewReport}
                >
                  <span class="thin">{card.targetLabel}</span>
                  <span class="score-value mut">{card.targetDisplay}</span>
                </button>
                <div class="score-mid">
                  <span class={card.percentClass}>{card.percentLabel}</span>
                  <span class="thin">achieved</span>
                </div>
                <button
                  class="score-side"
                  data-report-id={card.actualReportId}
                  onclick={handleViewReport}
                >
                  <span class="thin">{card.actualLabel}</span>
                  <span class={card.actualClass}>{card.actualDisplay}</span>
                </button>
              </div>
            </template>
            <template if:false={card.isCompare}>
              <p class={card.actualClass}>{card.actualDisplay}</p>
            </template>
          </div>
        </template>

        <template if:true={conversionCard}>
          <div class="report-card">
            <div class="card-top">
              <p class="lead-name">{conversionCard.title}</p>
              <button
                class="link-navigate"
                data-report-id={conversionCard.reportId}
                onclick={handleViewReport}
              >
                View
              </button>
            </div>
            <template if:true={conversionCard.warning}>
              <p class="lead-remark">{conversionCard.warning}</p>
            </template>
            <div class="conv-cols">
              <template for:each={conversionCard.stages} for:item="stage">
                <button
                  key={stage.key}
                  class="conv-col"
                  data-report-id={conversionCard.reportId}
                  data-value={stage.label}
                  onclick={handleFunnelStage}
                >
                  <span class="conv-n">{stage.displayValue}</span>
                  <span class="conv-bar" style={stage.barStyle}></span>
                  <span class="conv-l">{stage.label}</span>
                </button>
              </template>
            </div>
          </div>
        </template>

        <template for:each={extraCards} for:item="card">
          <div key={card.id} class="report-card">
            <div class="card-top">
              <p class="lead-name">{card.title}</p>
              <button
                class="link-navigate"
                data-report-id={card.viewReportId}
                onclick={handleViewReport}
              >
                View
              </button>
            </div>
            <template if:true={card.warning}>
              <p class="lead-remark">{card.warning}</p>
            </template>
            <p class={card.actualClass}>{card.actualDisplay}</p>
          </div>
        </template>
      </div>
    </div>
    <template if:true={hasMoreTeamReports}>
      <p class="more-hint">{moreTeamReportsLabel}</p>
    </template>
  </div>
</template>
