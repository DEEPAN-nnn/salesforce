<template>
  <div class="dash">
    <template if:true={hasError}>
      <p class="error-banner">{errorMessage}</p>
    </template>

    <div class="dash-head">
      <div>
        <h1 class="dash-title">My Dashboard</h1>
        <p class="dash-asof">{asOfLabel}</p>
      </div>
      <button class="dash-refresh" title="Refresh" onclick={handleRefresh}>
        ↻
      </button>
    </div>

    <template if:true={hasNoTeamReports}>
      <p class="empty-state">No team reports to show.</p>
    </template>

    <div class="dash-scroll">
      <div class={dashScrollInnerClass}>
        <div class="metric-grid">
          <template for:each={metricCards} for:item="card">
            <article key={card.id} class="metric-card">
              <p class="metric-title">{card.displayName}</p>
              <p class={card.numberClass}>{card.displayValue}</p>
              <template if:true={card.warning}>
                <p class="lead-remark">{card.warning}</p>
              </template>
              <button
                class="view-report"
                data-report-id={card.reportId}
                onclick={handleViewReport}
              >
                View Report
              </button>
            </article>
          </template>
        </div>

        <template if:true={conversionCard}>
          <article class="conversion-card">
            <p class="metric-title">{conversionCard.displayName}</p>
            <template for:each={conversionCard.stages} for:item="stage">
              <button
                key={stage.key}
                class="bar-row"
                data-report-id={conversionCard.reportId}
                data-value={stage.label}
                onclick={handleFunnelStage}
              >
                <span class="bar-label">{stage.label}</span>
                <span class="bar-track">
                  <span class="bar-fill" style={stage.barStyle}></span>
                </span>
                <span class="bar-count">{stage.displayValue}</span>
              </button>
            </template>
            <template if:true={conversionCard.warning}>
              <p class="lead-remark">{conversionCard.warning}</p>
            </template>
            <button
              class="view-report"
              data-report-id={conversionCard.reportId}
              onclick={handleViewReport}
            >
              View Report
            </button>
          </article>
        </template>
      </div>
      <template if:true={hasDashOverflow}>
        <p class="more-hint">{dashMoreHint}</p>
      </template>
    </div>
  </div>
</template>
